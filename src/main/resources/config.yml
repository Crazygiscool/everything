    filler: "BLACK_STAINED_GLASS_PANE"
    unauthorized-mode: "lock"
    items:
      info:
        slot: 4
        icon: "NETHER_STAR"
        name: "<aqua>Everything"
        lore:
          - "Version: <green>%version%"
          - "See all commands and features."
        action: "close"
      commands:
        slot: 10
        icon: "BOOK"
        name: "<yellow>Command List"
        lore: "<gray>View commands and usage."
        action: "perform_command"
        target: "everything help"
        chat: true
      settings:
        slot: 12
        icon: "COMMAND_BLOCK"
        name: "<green>Player Settings"
        lore: "<gray>Personal cosmetic and chat options."
