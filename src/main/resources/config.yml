      admin:
        slot: 14
        icon: "REDSTONE"
        name: "<red>Admin Controls"
        permission: "everything.menu.admin"
        lore: "<gray>Feature toggles and runtime controls."
        action: "open_menu"
        target: "admin"
        chat: true
      help:
        slot: 16
        icon: "PAPER"
        name: "<aqua>Help Pages"
        lore: "<gray>Open the add-on help menu."
        action: "open_help"
